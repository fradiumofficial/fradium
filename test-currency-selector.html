<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Selector Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #171a1c;
        color: white;
        padding: 20px;
      }
      .test-container {
        max-width: 500px;
        margin: 0 auto;
        background: #ffffff08;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 20px;
      }
      .currency-selector {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .currency-dropdown {
        min-width: 100px;
        padding: 12px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        cursor: pointer;
      }
      .amount-input {
        flex: 1;
        padding: 12px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
      }
      .amount-input::placeholder {
        color: #b0b6be;
      }
      .currency-list {
        background: #161b22;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        max-height: 300px;
        overflow-y: auto;
        margin-top: 5px;
        display: none;
      }
      .currency-item {
        padding: 12px 16px;
        cursor: pointer;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .currency-item:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      .currency-item:last-child {
        border-bottom: none;
      }
      .currency-symbol {
        font-weight: bold;
        margin-right: 8px;
      }
      .currency-name {
        color: rgba(255, 255, 255, 0.5);
        font-size: 12px;
      }
      .loading {
        padding: 12px 16px;
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="test-container">
      <h2>Currency Selector Test</h2>
      <p>This is a test of the currency selector functionality for the Transak modal.</p>

      <div class="currency-selector">
        <div class="currency-dropdown" onclick="toggleDropdown()">
          <span id="selected-currency">USD</span>
          <span style="float: right">▼</span>
        </div>
        <input type="number" class="amount-input" placeholder="Enter USD amount" id="amount-input" />
      </div>

      <div class="currency-list" id="currency-list">
        <div class="loading">Loading currencies...</div>
      </div>

      <div id="test-results"></div>
    </div>

    <script>
      let currencies = [];
      let selectedCurrency = "USD";

      async function fetchCurrencies() {
        try {
          const response = await fetch("https://api-stg.transak.com/fiat/public/v1/currencies/fiat-currencies", {
            method: "GET",
            headers: {
              accept: "application/json",
            },
          });

          if (!response.ok) {
            throw new Error(`API error: ${response.status}`);
          }

          const data = await response.json();

          if (data.response && Array.isArray(data.response)) {
            currencies = data.response.filter((currency) => currency.isPopular && currency.isAllowed);
            renderCurrencies();
          } else {
            throw new Error("Invalid response format");
          }
        } catch (error) {
          console.error("Error fetching currencies:", error);
          document.getElementById("currency-list").innerHTML = '<div class="loading">Error loading currencies. Using USD as fallback.</div>';
          currencies = [{ symbol: "USD", name: "US Dollar", isPopular: true, isAllowed: true }];
        }
      }

      function renderCurrencies() {
        const currencyList = document.getElementById("currency-list");
        currencyList.innerHTML = currencies
          .map(
            (currency) => `
                <div class="currency-item" onclick="selectCurrency('${currency.symbol}', '${currency.name}')">
                    <span class="currency-symbol">${currency.symbol}</span>
                    <span class="currency-name">${currency.name}</span>
                </div>
            `
          )
          .join("");
      }

      function toggleDropdown() {
        const currencyList = document.getElementById("currency-list");
        currencyList.style.display = currencyList.style.display === "none" ? "block" : "none";
      }

      function selectCurrency(symbol, name) {
        selectedCurrency = symbol;
        document.getElementById("selected-currency").textContent = symbol;
        document.getElementById("amount-input").placeholder = `Enter ${symbol} amount`;
        document.getElementById("currency-list").style.display = "none";

        // Update test results
        document.getElementById("test-results").innerHTML = `
                <div style="margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                    <h3>Selected Currency:</h3>
                    <p><strong>Symbol:</strong> ${symbol}</p>
                    <p><strong>Name:</strong> ${name}</p>
                    <p><strong>Total Currencies Available:</strong> ${currencies.length}</p>
                </div>
            `;
      }

      // Load currencies on page load
      fetchCurrencies();

      // Close dropdown when clicking outside
      document.addEventListener("click", function (event) {
        const currencyList = document.getElementById("currency-list");
        const currencyDropdown = document.querySelector(".currency-dropdown");

        if (!currencyDropdown.contains(event.target) && !currencyList.contains(event.target)) {
          currencyList.style.display = "none";
        }
      });
    </script>
  </body>
</html>
